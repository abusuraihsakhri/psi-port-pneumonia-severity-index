services:
  psi-port-pneumonia-severity-index:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PROVIDER: mock
      # Supply a private, stable value through the host environment.
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in your environment}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
