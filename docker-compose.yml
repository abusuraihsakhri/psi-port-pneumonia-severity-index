version: '3.8'

services:
  psi-port-pneumonia-severity-index:
    build: .
    container_name: psi-port-pneumonia-severity-index
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=psi-port-pneumonia-severity-index-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
